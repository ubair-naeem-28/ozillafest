name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        env:
          GITHUB_PAGES: true
        run: npm run build

      - name: Add SPA fallback for client-side routing
        working-directory: client
        run: cp dist/index.html dist/404.html

      - name: Publish build to docs folder
        run: |
          rm -rf docs
          cp -r client/dist docs
          touch docs/.nojekyll

      - name: Commit and push docs folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy frontend to GitHub Pages [skip ci]"
          git push
